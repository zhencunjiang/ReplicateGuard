[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replicateguard"
version = "0.1.0"
description = "Preflight validation of experimental designs for single-cell differential expression"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Zhencun Jiang", email = "zhencunjiang@tongji.edu.cn"},
  {name = "Yuchen Cai", email = "yccai19@fudan.edu.cn"}
]
keywords = [
  "single-cell",
  "differential-expression",
  "experimental-design",
  "pseudoreplication",
  "bioinformatics"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = []

[project.optional-dependencies]
anndata = ["anndata>=0.10"]

[project.scripts]
replicateguard = "replicateguard.cli:main"

[project.urls]
Homepage = "https://github.com/zhencunjiang/ReplicateGuard"
Repository = "https://github.com/zhencunjiang/ReplicateGuard"
Issues = "https://github.com/zhencunjiang/ReplicateGuard/issues"
Releases = "https://github.com/zhencunjiang/ReplicateGuard/releases"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
