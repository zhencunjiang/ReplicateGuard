name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: replicateguard-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop application
        run: pnpm run check

      - name: Build NSIS installer
        run: pnpm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReplicateGuard-Windows-x64
          path: |
            desktop/release/ReplicateGuard-*-Windows-x64-Setup.exe
            desktop/release/ReplicateGuard-*-Windows-x64-Setup.exe.blockmap

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            desktop/release/ReplicateGuard-*-Windows-x64-Setup.exe
            desktop/release/ReplicateGuard-*-Windows-x64-Setup.exe.blockmap
